<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15142a" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..150,500..900&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/spiral.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <script src="/js/app/theme-boot.js"></script>
  <meta name="description" content="Choose a new password for your Spiral Sounds account.">
  <title>Set a new password: Spiral Sounds</title>
  <script src="/js/app/auth.js" type="module"></script>
</head>
<body class="page-auth">
  <div id="shell-top"></div>
  <main id="main" class="auth">
    <section class="auth-form"><div>
      <h1>Set a new password</h1>
      <p class="lede">Pick something you have not used here before.</p>
      <form id="reset-form" data-form="reset" novalidate>
        <div class="field"><label for="password">New password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-rules">
          <ul class="password-rules" id="password-rules" data-rules-for="password">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="case">Upper and lower case letters</li>
            <li data-rule="number">A number</li>
            <li data-rule="symbol">One of @ $ ! % * ? &amp;</li>
            <li data-rule="allowed">Only letters, numbers, and those symbols</li>
          </ul>
          <p class="field-error" data-error-for="password" hidden></p></div>
        <div class="field"><label for="confirmPassword">Type it again</label>
          <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
          <p class="field-error" data-error-for="confirmPassword" hidden></p></div>
        <div class="notice notice--error" data-form-error role="alert" hidden></div>
        <button class="btn btn--primary btn--block" type="submit">Save new password</button>
      </form>
      <div class="notice notice--ok" data-form-done role="status" hidden></div>
      <div class="auth-alt"><a href="/forgot-password.html">Request a new link</a></div>
    </div></section>
<div class="auth-crate" aria-hidden="true">
      <ul>
        <li><img src="/images/vinyl3.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl7.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl2.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl6.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl10.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl4.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl8.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl1.webp" alt="" width="400" height="400"></li>
        <li><img src="/images/vinyl5.webp" alt="" width="400" height="400"></li>
      </ul>
    </div>
  </main>
</body>
</html>
